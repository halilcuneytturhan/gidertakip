name: emugider
description: "EmuGider — yazdığın harcamaları gün gün toplayan sade gider takibi."
publish_to: 'none'

# Android'de build-name versionName, build-number versionCode olur.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  archive: ^4.6.0
  file_selector: ^1.1.0
  flutter_local_notifications: 22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/images/brand/
    - assets/legal/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
